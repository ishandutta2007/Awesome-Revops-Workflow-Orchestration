<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations for Dynamic Aspects */
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes particleMove {
      0% { transform: translate(0, 0); opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { transform: translate(40px, -30px); opacity: 0.3; }
    }

    .bg-grid {
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 1;
    }

    .flow-line {
      stroke: #6366f1;
      stroke-width: 2;
      stroke-dasharray: 8 6;
      animation: flowLine 15s linear infinite;
      opacity: 0.5;
    }

    .pulse-circle {
      animation: pulseNode 3s ease-in-out infinite;
      transform-origin: center;
    }

    .card-float-1 { animation: floatCard 4s ease-in-out infinite; transform-origin: center; }
    .card-float-2 { animation: floatCard 5s ease-in-out infinite 1s; transform-origin: center; }
    .card-float-3 { animation: floatCard 4.5s ease-in-out infinite 2s; transform-origin: center; }

    .particle { animation: particleMove 6s ease-in-out infinite alternate; }

    /* Foreground Elements - Ensured High Readability & Layer Priority */
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }

    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #e2e8f0;
      letter-spacing: 0.2px;
    }

    .badge-pill {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #38bdf8;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Animated Grid Pattern -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="750" y1="0" x2="750" y2="380"/>
    <line x1="900" y1="0" x2="900" y2="380"/>
    <line x1="1050" y1="0" x2="1050" y2="380"/>
  </g>

  <!-- Dynamic Glowing Background Orbs -->
  <circle cx="1000" cy="90" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="200" cy="300" r="120" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Dynamic Flow Connections (Background Layer) -->
  <path d="M 150 310 Q 300 270 450 310 T 750 310 T 1050 280" class="flow-line"/>
  <path d="M 200 70 Q 500 40 850 70" class="flow-line" style="animation-duration: 20s; stroke: #38bdf8;"/>

  <!-- Floating Feature Cards (Middle Ground - Styled below text) -->
  <!-- Card 1: Lead Routing -->
  <g class="card-float-1" transform="translate(60, 270)">
    <rect width="180" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.9"/>
    <circle cx="30" cy="32" r="12" fill="#0284c7" opacity="0.3"/>
    <circle cx="30" cy="32" r="6" fill="#38bdf8" class="pulse-circle"/>
    <text x="52" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Lead Routing</text>
    <text x="52" y="46" font-family="sans-serif" font-size="11" fill="#94a3b8">Matching &amp; Assignment</text>
  </g>

  <!-- Card 2: CRM Synchronization -->
  <g class="card-float-2" transform="translate(480, 275)">
    <rect width="210" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.9"/>
    <circle cx="32" cy="32" r="12" fill="#4f46e5" opacity="0.3"/>
    <circle cx="32" cy="32" r="6" fill="#818cf8" class="pulse-circle"/>
    <text x="55" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Data Synchronization</text>
    <text x="55" y="46" font-family="sans-serif" font-size="11" fill="#94a3b8">Multi-System Bi-Directional</text>
  </g>

  <!-- Card 3: Agentic GTM OS -->
  <g class="card-float-3" transform="translate(930, 260)">
    <rect width="210" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.9"/>
    <circle cx="32" cy="32" r="12" fill="#9333ea" opacity="0.3"/>
    <circle cx="32" cy="32" r="6" fill="#c084fc" class="pulse-circle"/>
    <text x="55" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Agentic GTM OS</text>
    <text x="55" y="46" font-family="sans-serif" font-size="11" fill="#94a3b8">Autonomous AI Workflows</text>
  </g>

  <!-- Ambient Floating Particles -->
  <circle cx="280" cy="140" r="3" fill="#38bdf8" class="particle"/>
  <circle cx="650" cy="110" r="4" fill="#818cf8" class="particle" style="animation-delay: 2s;"/>
  <circle cx="920" cy="130" r="3" fill="#c084fc" class="particle" style="animation-delay: 4s;"/>

  <!-- Foreground Header Banner Box (Ensures High Contrast & Readability) -->
  <g transform="translate(60, 50)">
    <!-- Category Pill Badge -->
    <rect width="250" height="28" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" opacity="0.95"/>
    <text x="16" y="19" class="badge-pill">🚀 REVOPS &amp; GTM ORCHESTRATION</text>

    <!-- Main Title -->
    <text x="0" y="82" class="title-text" filter="url(#softGlow)">Awesome RevOps Workflow Orchestration</text>

    <!-- Subtitle -->
    <text x="0" y="118" class="subtitle-text">Curated Ecosystem of Revenue Operations Platforms, Data Synchronization &amp; Self-Hosted AI Engines</text>
  </g>
</svg>
